name: Test Nix Flake

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Validate flake structure on Linux (fast, platform-agnostic check)
  flake-check:
    name: Flake Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check --no-build

      - name: Show flake outputs
        run: nix flake show

  # Build the macOS (aarch64-darwin) nix-darwin configuration
  build-darwin:
    name: Build nix-darwin (macOS aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build nix-darwin configuration (dry-run)
        run: |
          nix build .#darwinConfigurations.TY.system \
            --dry-run \
            --show-trace

  # Placeholder for future Linux (NixOS / generic Linux) support
