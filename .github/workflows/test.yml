name: Test Nix Flake

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Validate flake structure on Linux (fast, platform-agnostic check)
  flake-check:
    name: Flake Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check --no-build

      - name: Show flake outputs
        run: nix flake show

      # Evaluate and instantiate the aarch64-darwin configuration on Linux.
      # Evaluation is host-independent (nixpkgs.hostPlatform is pinned in
      # nix/darwin/configuration.nix) and --dry-run never enforces the target
      # system, so a macOS runner is not required.
      - name: Evaluate nix-darwin configuration (aarch64-darwin)
        run: |
          nix eval --raw .#darwinConfigurations.TY.config.system.build.toplevel.drvPath
          nix build .#darwinConfigurations.TY.system \
            --dry-run \
            --show-trace

  # Platform-agnostic contract tests for dotfiles and tooling. These need
  # neither macOS nor a Nix build, so they run on Linux via the Taskfile
  # (single source of truth shared with local development).
  test-tooling:
    name: Tooling Contracts (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify chezmoi ownership and restoration
        run: nix shell --inputs-from . pkfire nixpkgs#chezmoi nixpkgs#python3 nixpkgs#ripgrep --command pkf run test-chezmoi

      - name: Verify the AeroSpace automation contract
        run: nix shell --inputs-from . pkfire nixpkgs#ripgrep nixpkgs#nodejs --command pkf run test-aerospace

      - name: Run headless Neovim configuration tests
        run: nix shell --inputs-from . pkfire nixpkgs#neovim --command pkf run test-neovim

  # Placeholder for future Linux (NixOS / generic Linux) support
  # Uncomment and extend when a Linux home-manager configuration is added.
